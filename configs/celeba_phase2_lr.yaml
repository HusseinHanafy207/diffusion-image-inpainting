# Phase 2 — learning-rate stabilization finetune (CelebA)
#
# Hypothesis: late training at 2e-4 drifts into dark-eye / sunglasses modes;
# micro-steps (2e-5) from epoch 30 may preserve structure without that collapse.
#
# Control vs Phase 1: same uniform mask mix as baseline, zero center jitter.
# Only change: learning_rate 2e-4 → 2e-5.
#
# Resume from epoch 30, train 5 more epochs (31–35):
#   python scripts/train.py --config configs/celeba_phase2_lr.yaml \
#     --resume /path/to/epoch_030.pt --epochs 35 \
#     --data-dir /content/celeba_data \
#     --checkpoint-dir .../celeba_phase2/checkpoints \
#     --log-dir .../celeba_phase2/logs \
#     --sample-dir .../celeba_phase2/samples
#
# Fair compare: Phase-2 epoch 33–35 vs original epoch 35/40, same seed, cr=0.40.

dataset: CelebA
data_dir: data/raw
image_size: 64
image_channels: 3

# Baseline mask mix (uniform) — no Phase-1 weights / jitter
mask_types:
  - center
  - rectangle
  - brush
  - holes
center_ratio: 0.4
center_jitter_ratio: 0.0
rect_min_ratio: 0.2
rect_max_ratio: 0.5
brush_num_strokes: [1, 4]
brush_thickness: [2, 5]
brush_steps: 16
holes_num: [3, 12]
holes_radius: [2, 5]

batch_size: 32
epochs: 35
learning_rate: 0.00002
optimizer: Adam
num_workers: 2
pin_memory: true

num_timesteps: 1000
beta_start: 0.0001
beta_end: 0.02

base_channels: 64
channel_mult: [1, 2, 4]
num_res_blocks: 2
attention_resolutions: [16]
dropout: 0.1

device: auto

checkpoint_dir: outputs/celeba_phase2/checkpoints
sample_dir: outputs/celeba_phase2/samples
figure_dir: outputs/celeba_phase2/figures
log_dir: outputs/celeba_phase2/logs
train_metrics_file: train_metrics.csv
val_metrics_file: val_metrics.csv
checkpoint_every: 1

metrics:
  - psnr
  - ssim

seed: 42
